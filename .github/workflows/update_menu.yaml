name: Daily UNC Dining Menu Sync

on:
  schedule:
    # Runs daily at 11:00 UTC (6:00 AM EST)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape CDS Menus & Map Coolfood Factors
        run: python scrape_cds.py

      - name: Commit and push updated menu_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CDS menu for $(date +'%Y-%m-%d')" && git push)
